<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modern Login</title>
    <style>
        :root {
            --bg: #0f172a;
            /* base background */
            --card: #111827;
            /* card background */
            --text: #e5e7eb;
            /* main text */
            --muted: #9ca3af;
            /* muted text */
            --primary: #6366f1;
            /* primary brand */
            --primary-700: #4f46e5;
            /* hover */
            --ring: rgba(99, 102, 241, .45);
            --error: #ef4444;
            --success: #10b981;
            --border: #1f2937;
            --input: #0b1220;
        }

        /* Light theme (auto when body has .light) */
        body.light {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --primary: #4f46e5;
            --primary-700: #4338ca;
            --ring: rgba(79, 70, 229, .35);
            --border: #e5e7eb;
            --input: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
            background: radial-gradient(1000px 600px at 10% 10%, rgba(99, 102, 241, .15), transparent 60%),
                radial-gradient(800px 500px at 90% 20%, rgba(16, 185, 129, .12), transparent 55%),
                linear-gradient(180deg, var(--bg), var(--bg));
            color: var(--text);
            display: grid;
            place-items: center;
            transition: background .3s ease, color .3s ease;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin-bottom: 1.25rem;
            user-select: none;
        }

        .logo {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), #22c55e);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
        }

        .brand span {
            font-weight: 700;
            letter-spacing: .2px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .35);
            padding: 1.25rem;
            backdrop-filter: blur(6px);
        }

        .card h1 {
            font-size: 1.35rem;
            margin: .25rem 0 .75rem;
            line-height: 1.2;
        }

        .desc {
            color: var(--muted);
            font-size: .95rem;
            margin-bottom: 1rem;
        }

        .field {
            margin-bottom: .9rem;
        }

        .field label {
            display: block;
            font-size: .9rem;
            margin: 0 0 .4rem;
            color: var(--muted);
        }

        .input {
            display: flex;
            align-items: center;
            gap: .5rem;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: .7rem .9rem;
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .input:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--ring);
        }

        .input input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--text);
            font-size: .98rem;
        }

        .toggle-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: .9rem;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
            margin: .2rem 0 1rem;
        }

        .row a {
            color: var(--primary);
            text-decoration: none;
            font-size: .9rem;
        }

        .row a:hover {
            text-decoration: underline;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: .55rem;
            font-size: .92rem;
            color: var(--muted);
        }

        .checkbox input {
            width: 16px;
            height: 16px;
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: .85rem 1rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-700));
            color: white;
            box-shadow: 0 10px 24px rgba(99, 102, 241, .35);
            transition: transform .08s ease, filter .2s ease;
        }

        .btn:hover {
            filter: brightness(1.05);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .or {
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: .75rem;
            color: var(--muted);
            font-size: .9rem;
        }

        .or::before,
        .or::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--border);
        }

        .oauth {
            display: grid;
            gap: .6rem;
            grid-template-columns: 1fr 1fr;
        }

        .oauth button {
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
            padding: .7rem .8rem;
            border-radius: 10px;
            cursor: pointer;
        }

        .signup {
            margin-top: 1rem;
            text-align: center;
            color: var(--muted);
            font-size: .95rem;
        }

        .signup a {
            color: var(--primary);
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .theme-toggle {
            position: fixed;
            top: 14px;
            right: 14px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 999px;
            padding: .5rem .75rem;
            cursor: pointer;
            font-size: .9rem;
        }

        .error {
            color: var(--error);
            font-size: .9rem;
            margin: .35rem 0 .2rem;
            min-height: 1.25rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        @media (max-width: 420px) {
            .container {
                padding: 1rem;
            }

            .oauth {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="Toggle theme">🌙 Dark</button>
    <main class="container">
        <div class="brand" aria-hidden="true">
            <div class="logo" title="Logo">
                <!-- simple spark logo -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2l2.2 4.9L19 9l-4.3 2.1L12 16l-2.7-4.9L5 9l4.8-2.1L12 2z" fill="white" />
                </svg>
            </div>
            <span>Acme</span>
        </div>

        <section class="card" role="form" aria-labelledby="loginTitle">
            <h1 id="loginTitle">Welcome back</h1>
            <p class="desc">Sign in to your account to continue.</p>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <div class="input">
                        <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
                            placeholder="you@example.com" required aria-describedby="emailError" />
                    </div>
                    <div id="emailError" class="error" aria-live="polite"></div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input">
                        <input id="password" name="password" type="password" autocomplete="current-password"
                            placeholder="••••••••" minlength="6" required aria-describedby="passwordError" />
                        <button type="button" class="toggle-btn" id="togglePassword" aria-controls="password"
                            aria-pressed="false">Show</button>
                    </div>
                    <div id="passwordError" class="error" aria-live="polite"></div>
                </div>

                <div class="row">
                    <label class="checkbox"><input type="checkbox" id="remember" name="remember" /> Remember me</label>
                    <a href="#" aria-label="Forgot your password?">Forgot password?</a>
                </div>

                <button class="btn" type="submit">Sign in</button>

                <div class="or">Or continue with</div>
                <div class="oauth">
                    <button type="button" aria-label="Continue with Google">Google</button>
                    <button type="button" aria-label="Continue with GitHub">GitHub</button>
                </div>

                <p class="signup">No account? <a href="#">Create one</a></p>
            </form>
        </section>
    </main>

    <script>
        // Theme toggle (persists to localStorage)
        const themeToggle = document.getElementById('themeToggle');
        const applyTheme = (mode) => {
            if (mode === 'light') document.body.classList.add('light');
            else document.body.classList.remove('light');
            themeToggle.textContent = mode === 'light' ? '🌙 Dark' : '☀️ Light';
            themeToggle.setAttribute('aria-pressed', mode !== 'light');
            localStorage.setItem('theme', mode);
        };
        const saved = localStorage.getItem('theme');
        applyTheme(saved || 'dark');
        themeToggle.addEventListener('click', () => {
            const next = document.body.classList.contains('light') ? 'dark' : 'light';
            applyTheme(next);
        });

        // Show/hide password
        const pw = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        toggleBtn.addEventListener('click', () => {
            const isText = pw.getAttribute('type') === 'text';
            pw.setAttribute('type', isText ? 'password' : 'text');
            toggleBtn.textContent = isText ? 'Show' : 'Hide';
            toggleBtn.setAttribute('aria-pressed', String(!isText));
        });

        // Client-side validation with accessible messages
        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const password = document.getElementById('password');
        const passwordError = document.getElementById('passwordError');

        function validateEmail() {
            if (!email.value.trim()) {
                emailError.textContent = 'Email is required.';
                return false;
            }
            if (!email.checkValidity()) {
                emailError.textContent = 'Please enter a valid email address.';
                return false;
            }
            emailError.textContent = '';
            return true;
        }

        function validatePassword() {
            if (!password.value.trim()) {
                passwordError.textContent = 'Password is required.';
                return false;
            }
            if (password.value.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters.';
                return false;
            }
            passwordError.textContent = '';
            return true;
        }

        email.addEventListener('input', validateEmail);
        password.addEventListener('input', validatePassword);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const ok = validateEmail() & validatePassword();
            if (!ok) return;

            // Demo success state
            form.querySelector('.btn').disabled = true;
            form.querySelector('.btn').textContent = 'Signing in…';

            setTimeout(() => {
                form.querySelector('.btn').disabled = false;
                form.querySelector('.btn').textContent = 'Sign in';
                alert('Signed in! (demo)');
            }, 900);
        });
    </script>
</body>

</html>
